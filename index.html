  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #131c31;
      --bg-elevated: #1e293b;
      --border-col: #2dd4bf33;
      --border-subtle: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --gold: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .kw-highlight b, b.kw {
      color: #34d399;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      padding: 0 4px;
      border-radius: 4px;
    }
    .cloze-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      padding: 2px 10px;
      margin: 2px 4px;
      border-radius: 6px;
      border: 2px dashed #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cloze-slot.filled {
      border-style: solid;
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }
    .cloze-slot.wrong {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    .option-btn {
      transition: all 0.15s ease;
      text-align: left;
    }
    .option-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.95);
    }
    .option-btn.correct-ans {
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.18) !important;
      color: #ecfdf5 !important;
    }
    .option-btn.wrong-ans {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.18) !important;
      color: #fef2f2 !important;
    }
    .match-card {
      transition: all 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .match-card.selected {
      border-color: #38bdf8 !important;
      background: rgba(56, 189, 248, 0.2) !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }
    .match-card.matched {
      opacity: 0.35;
      pointer-events: none;
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.1) !important;
    }
    .match-card.error-flash {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.28) !important;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

<body class="min-h-screen flex flex-col">

  <!-- TOP HEADER -->

      <!-- KPI PILLS -->
      <div class="flex items-center gap-2 sm:gap-3 text-xs">
        <div class="px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700 flex items-center gap-1.5" title="Definiciones nuevas o con probabilidad de recuerdo R ≤ umbral FSRS">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span class="text-slate-400 hidden md:inline">Pendientes hoy:</span>
          <span id="kpi-due" class="font-extrabold text-amber-400 tabular-nums">0</span>
        </div>
        <div class="px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700 flex items-center gap-1.5" title="Retención media calculada en tiempo real con la curva de olvido FSRS">

          <span id="kpi-retention" class="font-extrabold text-sky-400 tabular-nums">100%</span>
        </div>
        <div class="px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700 flex items-center gap-1.5" title="Definiciones con estabilidad S ≥ 7 días">
          <span class="text-slate-400 hidden md:inline">Consolidadas:</span>
          <span id="kpi-mastered" class="font-extrabold text-emerald-400 tabular-nums">0/49</span>
        </div>
        <button id="btn-install-pwa" onclick="installPWA()" class="hidden px-2.5 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs transition shadow">

        </button>
        <div class="px-2.5 py-1 rounded-lg bg-slate-800/90 border border-slate-700 flex items-center gap-1" title="Racha de aciertos seguidos">
          <span>🔥</span>
          <span id="kpi-streak" class="font-extrabold text-orange-400 tabular-nums">0</span>
        </div>
      </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="max-w-6xl mx-auto mt-2.5 flex items-center gap-1.5 overflow-x-auto pb-0.5">
      <button onclick="switchTab('play')" id="tab-btn-play" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow">

    </div>
  </header>

    dailyNewLimit: 7,
    includePage3: true,
    streak: 0,
    bestStreak: 0,
    totalReviews: 0,
    cards: {},
    confusions: {}
  };

  function getNowMs() {
    return Date.now() + (appState.timeOffsetDays * 86400 * 1000);
  }

  function createEmptyCard(id) {
    return { id, state: 'new', S: 0, D: 5.0, lastReview: null, due: null, reps: 0, lapses: 0, lastGrade: null };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        appState = { ...appState, ...parsed };
      }
    } catch (e) {}
    DEFINITIONS.forEach(d => {
      if (!appState.cards[d.id]) appState.cards[d.id] = createEmptyCard(d.id);
    });
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch (e) {}
    updateTopKPIs();
  }

  function getRetrievability(card, nowMs = getNowMs()) {
    if (!card || card.state === 'new' || !card.lastReview || card.S <= 0) return 0;
    const elapsedDays = Math.max(0, (nowMs - card.lastReview) / (86400 * 1000));
    const r = Math.pow(1 + (19 / 81) * (elapsedDays / card.S), -0.5);
    return Math.max(0.01, Math.min(1, r));
  }

  function stabilityToIntervalDays(S, targetR = appState.targetRetention) {
    const factor = (81 / 19) * (Math.pow(targetR, -2) - 1);
    return Math.max(0.05, S * factor);
  }

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  function previewFSRS(card, grade, nowMs = getNowMs()) {
    const c = { ...card };
    const isNew = c.state === 'new' || !c.lastReview || c.S <= 0;
    let nextS, nextD;
    const d0_easy = FSRS_W[4] - Math.exp(FSRS_W[5] * (4 - 1)) + 1;

    if (isNew) {
      const initialS = [0, 0.25, 1.1, 3.0, 7.5];
      nextS = initialS[grade];
      nextD = clamp(FSRS_W[4] - Math.exp(FSRS_W[5] * (grade - 1)) + 1, 1, 10);
    } else {
      const elapsedDays = Math.max(0.01, (nowMs - c.lastReview) / (86400 * 1000));
      const R = getRetrievability(c, nowMs);
      const deltaD = -FSRS_W[6] * (grade - 3);
      const dPrime = c.D + deltaD * ((10 - c.D) / 9);
      nextD = clamp(FSRS_W[7] * d0_easy + (1 - FSRS_W[7]) * dPrime, 1, 10);

      if (grade === 1) {
        nextS = Math.max(
          0.2,
          FSRS_W[11] * Math.pow(nextD, -FSRS_W[12]) * (Math.pow(c.S + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - R))
        );
        nextS = Math.min(nextS, c.S * 0.65);
      } else {
        const hardPenalty = grade === 2 ? FSRS_W[15] : 1;
        const easyBonus = grade === 4 ? FSRS_W[16] : 1;
        const sameDayFactor = elapsedDays < 0.35 ? 0.45 : 1.0;
        const inc = Math.exp(FSRS_W[8]) * (11 - nextD) * Math.pow(c.S, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - Math.min(0.95, R))) - 1) * hardPenalty * easyBonus * sameDayFactor;
        nextS = clamp(c.S * (1 + Math.max(0.12, inc)), 0.5, 365);
      }
    }

    const intervalDays = grade === 1 ? 0.02 : stabilityToIntervalDays(nextS, appState.targetRetention);
    return {
      S: Number(nextS.toFixed(2)),
      D: Number(nextD.toFixed(2)),
      intervalDays: Number(intervalDays.toFixed(2)),
      due: nowMs + intervalDays * 86400 * 1000,
      state: grade === 1 ? (isNew ? 'learning' : 'relearning') : 'review'
    };
  }

  function applyFSRSGrade(defId, grade) {
    const card = appState.cards[defId] || createEmptyCard(defId);
    const nowMs = getNowMs();
    const res = previewFSRS(card, grade, nowMs);
    card.S = res.S;
    card.D = res.D;
    card.state = res.state;
    card.lastReview = nowMs;
    card.due = res.due;
    card.reps = (card.reps || 0) + 1;
    if (grade === 1) card.lapses = (card.lapses || 0) + 1;
    card.lastGrade = grade;
    appState.cards[defId] = card;
    appState.totalReviews = (appState.totalReviews || 0) + 1;
    if (grade >= 2) {
      appState.streak = (appState.streak || 0) + 1;
      if (appState.streak > (appState.bestStreak || 0)) appState.bestStreak = appState.streak;
    } else {
      appState.streak = 0;
    }
    saveState();
    return res;
  }

  function recordConfusion(defIdA, defIdB) {
    if (!defIdA || !defIdB || defIdA === defIdB) return;
    const pair = [defIdA, defIdB].sort().join('__');
    appState.confusions[pair] = (appState.confusions[pair] || 0) + 1;
    saveState();
  }

  function getActiveDefinitions() {
    return DEFINITIONS.filter(d => appState.includePage3 || !d.id.match(/^(44|45|46)$/));
  }

  function isSameCalendarDay(tsA, tsB) {
    if (!tsA || !tsB) return false;
    const dA = new Date(tsA);
    const dB = new Date(tsB);
    return dA.getFullYear() === dB.getFullYear() &&
           dA.getMonth() === dB.getMonth() &&
           dA.getDate() === dB.getDate();
  }

  // Devuelve las tarjetas ya estudiadas que hoy han caído al umbral de olvido (R <= targetRetention) o quedaron en Again
  function getDueReviewsOnly() {
    const nowMs = getNowMs();
    return getActiveDefinitions().filter(d => {
      const c = appState.cards[d.id];
      if (!c || c.state === 'new' || !c.lastReview) return false;
      const r = getRetrievability(c, nowMs);
      return c.lastGrade === 1 || r <= appState.targetRetention + 0.005 || (c.due && c.due <= nowMs);
    });
  }

  // Devuelve todas las tarjetas que aún no se han estrenado nunca
  function getAllUnseenNewDefinitions() {
    return getActiveDefinitions().filter(d => {
      const c = appState.cards[d.id];
      return !c || c.state === 'new' || !c.lastReview;
    });
  }

  // Cuántas tarjetas se han contestado hoy
  function getStudiedTodayCount() {
    const nowMs = getNowMs();
    return getActiveDefinitions().filter(d => {
      const c = appState.cards[d.id];
      return c && c.lastReview && isSameCalendarDay(c.lastReview, nowMs);
    }).length;
  }

  // Dosis diaria inteligente: Repasos vencidos hoy + Cupo restante de nuevas de hoy (7 por defecto)
  function getDueDefinitions() {
    const dueReviews = getDueReviewsOnly();
    const unseenNew = getAllUnseenNewDefinitions();
    const studiedToday = getStudiedTodayCount();
    const limit = appState.dailyNewLimit || 7;
    const remainingNewQuotaToday = Math.max(0, limit - studiedToday);
    const newForToday = unseenNew.slice(0, remainingNewQuotaToday);
    return [...dueReviews, ...newForToday];
  }

  // Calcula la recomendación exacta para la Tarjeta Única de Anki según tus tarjetas reales
  function getAnkiSingleCardAdvice() {
    const nowMs = getNowMs();
    const active = getActiveDefinitions();
    const dueReviews = getDueReviewsOnly();
    const unseenNew = getAllUnseenNewDefinitions();
    const studiedToday = getStudiedTodayCount();
    const dailyDoseLeft = getDueDefinitions().length;

    // Buscar cuándo vencen las tarjetas ya estudiadas
    const futureDuesDays = [];
    active.forEach(d => {
      const c = appState.cards[d.id];
      if (c && c.state !== 'new' && c.due) {
        const diffDays = Math.max(0.1, (c.due - nowMs) / (86400 * 1000));
        futureDuesDays.push(diffDays);
      }
    });
    futureDuesDays.sort((a, b) => a - b);

    const dueIn1d = futureDuesDays.filter(x => x <= 1.35).length;
    const dueIn2d = futureDuesDays.filter(x => x > 1.35 && x <= 2.6).length;
    const dueIn3plus = futureDuesDays.filter(x => x > 2.6).length;

    const earliestDays = futureDuesDays.length > 0 ? futureDuesDays[0] : 1;

    let recommendedDays = 1;
    let headline = '';
    let detail = '';

    if (dueReviews.length > 0) {
      recommendedDays = 1;
      headline = `Tienes ${dueReviews.length} repaso(s) vencido(s) ahora mismo`;
      detail = 'Termina primero esos repasos vencidos antes de cerrar tu tarjeta de Anki.';
    } else if (studiedToday === 0 && unseenNew.length > 0) {
      recommendedDays = 1;
      headline = `Haz tu Dosis Rápida de hoy (${Math.min(appState.dailyNewLimit || 7, unseenNew.length)} defs)`;
      detail = 'Cuando termines la tanda de hoy, aquí te saldrá qué botón pulsar en Anki.';
    } else if (unseenNew.length > 0) {
      // Ya ha cumplido hoy (ej. las 15 que ya hizo hoy), pero aún quedan definiciones nuevas por estrenar otros días
      recommendedDays = earliestDays < 1.2 ? 1 : (dueIn1d >= 2 ? 1 : 2);
      headline = `En tu tarjeta de Anki pulsa el botón que marque ~${recommendedDays} ${recommendedDays === 1 ? 'día (1d)' : 'días (2d)'}`;
      detail = `Hoy ya has entrenado ${studiedToday} definiciones. Como aún te quedan ${unseenNew.length} definiciones nuevas por ir estrenando en lotes cortos (y tienes ${dueIn1d} que vencen en ~1d y ${dueIn2d} en ~2d), en Anki elige el botón (Hard o Good) cuyo intervalo sea de ${recommendedDays}d.`;
    } else {
      // Ya se han estrenado las 49 definiciones: nos guiamos 100% por el próximo lote que baja del 90%
      // Tomamos el percentil 15 o la 2ª tarjeta más próxima para no despertar por 1 sola tarjeta aislada
      const refDays = futureDuesDays.length >= 3 ? futureDuesDays[2] : earliestDays;
      recommendedDays = Math.max(1, Math.round(refDays));
      headline = `En tu tarjeta de Anki pulsa el botón más cercano a ${recommendedDays} ${recommendedDays === 1 ? 'día' : 'días'}`;
      detail = `¡Ya tienes las ${active.length} definiciones estrenadas! Tu próximo bloque cae al 90% de retención en ${formatInterval(refDays)}. Mira los días encima de los botones de Anki (Hard / Good / Easy) y pulsa el que más se acerque a ${recommendedDays}d.`;
    }

    return {
      recommendedDays,
      headline,
      detail,
      studiedToday,
      unseenCount: unseenNew.length,
      dueReviewsCount: dueReviews.length,
      dailyDoseLeft,
      dueIn1d,
      dueIn2d,
      dueIn3plus
    };
  }

  function formatInterval(days) {
    if (days < 0.05) return '10 min (Sesión)';
    if (days < 1) return Math.round(days * 24) + ' h';
    if (days < 10) return days.toFixed(1) + ' d';
    return Math.round(days) + ' d';
  }
  </script>
  <script>
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function stripHtml(html) {
    return html.replace(/<[^>]*>/g, '');
  }

  function getDefById(id) {
    return DEFINITIONS.find(d => d.id === id);
  }

  function pickConfusableSiblings(def, count = 3) {
    const active = getActiveDefinitions().filter(d => d.id !== def.id);
    const userConfusedIds = Object.keys(appState.confusions || {})
      .filter(k => k.split('__').includes(def.id))
      .sort((a, b) => appState.confusions[b] - appState.confusions[a])
      .map(k => k.split('__').find(x => x !== def.id));

    const declaredIds = def.siblings || [];
    const clusterIds = active.filter(d => d.cluster === def.cluster).map(d => d.id);
    const orderedUniqueIds = [...new Set([...userConfusedIds, ...declaredIds, ...shuffle(clusterIds)])];

    const result = [];
    for (const id of orderedUniqueIds) {
      const found = active.find(d => d.id === id);
      if (found && !result.includes(found)) {
        result.push(found);
        if (result.length >= count) break;
      }
    }
    if (result.length < count) {
      for (const d of shuffle(active)) {
        if (!result.includes(d)) {
          result.push(d);
          if (result.length >= count) break;
        }
      }
    }
    return result;
  }

  function buildTwinsQuestion(def, forceExcerpt = false) {
    const siblings = pickConfusableSiblings(def, 3);
    const options = [{ text: def.term, isCorrect: true, defId: def.id, tag: 'Correcta' }];

    const useFakeTwins = def.fakeNames && def.fakeNames.length > 0 && Math.random() < 0.5;
    if (useFakeTwins) {
      const fakeName = shuffle(def.fakeNames)[0];
      options.push({ text: fakeName, isCorrect: false, defId: null, tag: 'Nombre Trampa (No existe en el art. 3)' });
      siblings.slice(0, 2).forEach(s => {
        options.push({ text: s.term, isCorrect: false, defId: s.id, tag: `Def. ${s.num}: ${s.hook}` });
      });
    } else {
      siblings.slice(0, 3).forEach(s => {
        options.push({ text: s.term, isCorrect: false, defId: s.id, tag: `Def. ${s.num}: ${s.hook}` });
      });
    }

    let displayedDef = stripHtml(def.def);
    let badge = 'Definición → Término (Duelo de Gemelos)';
    if ((forceExcerpt || Math.random() < 0.3) && displayedDef.length > 130) {
      const parts = displayedDef.split(/[.;]/).filter(p => p.trim().length > 35);
      if (parts.length > 1) {
        displayedDef = '«...' + parts[Math.floor(Math.random() * parts.length)].trim() + '...»';
        badge = 'Fragmento Nuclear → Término (Estilo Oficial GC)';
      }
    }

    return {
      mode: 'twins',
      badge,
      def,
      promptTitle: '¿A qué concepto de la Ley 42/2007 corresponde esta definición?',
      promptBody: `<div class="text-base sm:text-lg leading-relaxed text-slate-100 bg-slate-900/90 p-4 rounded-xl border border-slate-700/80 shadow-inner">
        <span class="text-emerald-400 font-serif text-xl mr-1">“</span>${displayedDef}<span class="text-emerald-400 font-serif text-xl ml-1">”</span>
      </div>`,
      options: shuffle(options)
    };
  }

  function buildInverseQuestion(def) {
    const siblings = pickConfusableSiblings(def, 3);
    const options = [{ text: stripHtml(def.def), isCorrect: true, defId: def.id, tag: 'Definición Oficial Exacta' }];

    if (def.traps && def.traps.length > 0 && Math.random() < 0.65) {
      const trap = shuffle(def.traps)[0];
      options.push({ text: trap.fakeText, isCorrect: false, defId: null, tag: trap.explanation });
      siblings.slice(0, 2).forEach(s => {
        options.push({ text: stripHtml(s.def), isCorrect: false, defId: s.id, tag: `Corresponde a «${s.term}» (n.º ${s.num})` });
      });
    } else {
      siblings.slice(0, 3).forEach(s => {
        options.push({ text: stripHtml(s.def), isCorrect: false, defId: s.id, tag: `Corresponde a «${s.term}» (n.º ${s.num})` });
      });
    }

    return {
      mode: 'inverse',
      badge: 'Término → Definición (Inverso Letal)',
      def,
      promptTitle: 'Señala la definición EXACTA a efectos de la Ley 42/2007 para:',
      promptBody: `<div class="p-4 rounded-xl bg-gradient-to-r from-emerald-950/70 to-slate-900 border border-emerald-500/40 flex items-center justify-between gap-3">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Concepto n.º ${def.num}</span>
          <h3 class="text-xl sm:text-2xl font-black text-white mt-0.5">${def.term}</h3>
        </div>
        ${def.official ? `<span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/40 shrink-0">🏆 ${def.official}</span>` : ''}
      </div>`,
      options: shuffle(options)
    };
  }

  function buildImpostorQuestion(def) {
    const isLiteral = Math.random() < 0.48;
    let shownText = stripHtml(def.def);
    let explanation = '¡Exacto! El texto mostrado coincide al 100% con el artículo 3 de la Ley 42/2007.';
    let SiblingConfusedId = null;

    if (!isLiteral) {
      if (def.traps && def.traps.length > 0 && Math.random() < 0.75) {
        const trap = shuffle(def.traps)[0];
        shownText = trap.fakeText;
        explanation = trap.explanation;
      } else {
        const twin = pickConfusableSiblings(def, 1)[0];
        shownText = stripHtml(twin.def);
        SiblingConfusedId = twin.id;
        explanation = `IMPOSTOR: Esa definición pertenece en realidad a su gemelo «${twin.term}» (n.º ${twin.num}).`;
      }
    }

    return {
      mode: 'impostor',
      badge: '🕵️ Caza al Impostor (Literal vs. Sabotaje)',
      def,
      promptTitle: 'Analiza con lupa cada palabra: ¿Es 100% OFICIAL o tiene TRAMPA?',
      promptBody: `<div class="space-y-3 bg-slate-900/95 p-4 sm:p-5 rounded-xl border border-slate-700">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <span class="text-lg sm:text-xl font-black text-emerald-400">${def.num}. ${def.term}</span>
          <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">${CLUSTERS[def.cluster].icon} ${CLUSTERS[def.cluster].name}</span>
        </div>
        <p class="text-base sm:text-lg leading-relaxed text-slate-100">“${shownText}”</p>
      </div>`,
      options: [
        {
          text: '✅ VERDADERO · Es 100% literal de la norma',
          isCorrect: isLiteral,
          defId: isLiteral ? def.id : SiblingConfusedId,
          tag: isLiteral ? 'Texto íntegro oficial' : explanation
        },
        {
          text: '🚨 IMPOSTOR / TRAMPA · Han alterado un matiz o es de otro concepto',
          isCorrect: !isLiteral,
          defId: !isLiteral ? def.id : SiblingConfusedId,
          tag: explanation
        }
      ],
      impostorExplanation: explanation
    };
  }

  function buildClozeQuestion(def) {
    const rawText = stripHtml(def.def);
    const targets = [];
    for (const phrase of (def.clozes || [])) {
      const idx = rawText.toLowerCase().indexOf(phrase.toLowerCase());
      if (idx !== -1) {
        targets.push({ phrase: rawText.slice(idx, idx + phrase.length), idx });
      }
    }
    targets.sort((a, b) => a.idx - b.idx);
    if (targets.length === 0) return buildTwinsQuestion(def);

    let htmlParts = '';
    let cursor = 0;
    targets.forEach((t, i) => {
      if (t.idx >= cursor) {
        htmlParts += rawText.slice(cursor, t.idx);
        htmlParts += `<span class="cloze-slot" data-slot="${i}" onclick="clearClozeSlot(${i})">[ Hueco ${i + 1} ]</span>`;
        cursor = t.idx + t.phrase.length;
      }
    });
    htmlParts += rawText.slice(cursor);

    const distractors = [];
    const siblings = pickConfusableSiblings(def, 5);
    for (const s of siblings) {
      for (const c of (s.clozes || [])) {
        if (!targets.some(t => t.phrase.toLowerCase() === c.toLowerCase()) && !distractors.includes(c)) {
          distractors.push(c);
        }
      }
    }
    const bank = shuffle([...targets.map(t => t.phrase), ...shuffle(distractors).slice(0, Math.max(3, 6 - targets.length))]);

    return {
      mode: 'cloze',
      badge: '🎯 Francotirador de Negritas (Huecos Clave)',
      def,
      targets: targets.map(t => t.phrase),
      filled: new Array(targets.length).fill(null),
      bank,
      promptTitle: `Toca las piezas clave en orden para completar «${def.term}»:`,
      promptBody: `<div class="space-y-3 bg-slate-900/95 p-4 sm:p-5 rounded-xl border border-slate-700">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <span class="text-lg font-black text-sky-400">${def.num}. ${def.term}</span>
          <span class="text-xs text-slate-400">Toca un hueco relleno si quieres corregir</span>
        </div>
        <div id="cloze-sentence" class="text-base sm:text-lg leading-loose text-slate-100">${htmlParts}</div>
      </div>`
    };
  }

  function buildSmartFSRSQuestion(def) {
    const card = appState.cards[def.id] || createEmptyCard(def.id);
    const roll = Math.random();
    if (card.reps === 0) return roll < 0.65 ? buildTwinsQuestion(def, false) : buildClozeQuestion(def);
    if (card.lapses > 0 || card.D >= 6.8) {
      if (roll < 0.38) return buildInverseQuestion(def);
      if (roll < 0.72) return buildImpostorQuestion(def);
      return buildTwinsQuestion(def, true);
    }
    if (roll < 0.28) return buildTwinsQuestion(def, true);
    if (roll < 0.55) return buildInverseQuestion(def);
    if (roll < 0.80) return buildImpostorQuestion(def);
    return buildClozeQuestion(def);
  }

  let currentSession = null;
  let speedMatchTimer = null;

  function updateTopKPIs() {
    const active = getActiveDefinitions();
    const due = getDueDefinitions();
    const nowMs = getNowMs();
    let sumR = 0, reviewedCount = 0, masteredCount = 0;

    active.forEach(d => {
      const c = appState.cards[d.id];
      if (c && c.state !== 'new' && c.lastReview) {
        sumR += getRetrievability(c, nowMs);
        reviewedCount++;
        if (c.S >= 7) masteredCount++;
      }
    });

    const avgR = reviewedCount > 0 ? Math.round((sumR / reviewedCount) * 100) : 100;
    const elDue = document.getElementById('kpi-due');
    const elRet = document.getElementById('kpi-retention');
    const elMas = document.getElementById('kpi-mastered');
    const elStr = document.getElementById('kpi-streak');

    if (elDue) elDue.textContent = due.length;
    if (elRet) elRet.textContent = reviewedCount > 0 ? `${avgR}%` : 'Nuevo';
    if (elMas) elMas.textContent = `${masteredCount}/${active.length}`;
    if (elStr) elStr.textContent = appState.streak || 0;
  }

  function switchTab(tabId) {

      clearInterval(speedMatchTimer);

    ['play', 'twins', 'radar', 'settings'].forEach(t => {

        btn.className = t === tabId

          : 'tab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-slate-800/80 text-slate-300 hover:bg-slate-700';
      }
    });

    if (tabId === 'play') renderPlayHub();
    if (tabId === 'twins') renderTwinsTab();
    if (tabId === 'radar') renderRadarTab();
    if (tabId === 'settings') renderSettingsTab();
  }

  function getNextDueForecastText() {
    const active = getActiveDefinitions();
    const nowMs = getNowMs();
    let minFutureDue = Infinity;
    active.forEach(d => {
      const c = appState.cards[d.id];
      if (c && c.due && c.due > nowMs && c.due < minFutureDue) minFutureDue = c.due;
    });
    if (minFutureDue === Infinity) return 'Aún no hay tarjetas programadas a futuro';
    const diffDays = (minFutureDue - nowMs) / (86400 * 1000);

  function startStudiedTodayReview() {
    const nowMs = getNowMs();
    const todayDefs = getActiveDefinitions().filter(d => {
      const c = appState.cards[d.id];
      return c && c.lastReview && isSameCalendarDay(c.lastReview, nowMs);
    });
    if (todayDefs.length === 0) return;
    launchQuestionQueue(shuffle(todayDefs).slice(0, 15), 'fsrs_daily', 'Repaso de las Definiciones Vistas Hoy');
  }

  function pickPrioritizedDefs(count, clusterFilter = null, onlyConfusions = false) {
    let pool = getActiveDefinitions();
    if (clusterFilter) pool = pool.filter(d => d.cluster === clusterFilter);
    if (onlyConfusions) {
      const confIds = new Set();
      Object.keys(appState.confusions || {}).forEach(pair => pair.split('__').forEach(id => confIds.add(id)));
      const filtered = pool.filter(d => confIds.has(d.id));
      if (filtered.length >= 2) pool = filtered;
    }

    const nowMs = getNowMs();
    const scored = pool.map(d => {
      const c = appState.cards[d.id] || createEmptyCard(d.id);
      const isNew = c.state === 'new' || !c.lastReview;
      const r = isNew ? 0.899 : getRetrievability(c, nowMs);
      const isDueReview = !isNew && (c.lastGrade === 1 || r <= appState.targetRetention + 0.005 || (c.due && c.due <= nowMs));
      return { def: d, isDueReview, isNew, r };
    });

    // Prioridad: 1º Repasos vencidos (menor R primero), 2º Nuevas en orden secuencial o por clúster, 3º Resto por menor R
    scored.sort((a, b) => {
      if (a.isDueReview !== b.isDueReview) return a.isDueReview ? -1 : 1;
      if (a.isNew !== b.isNew) return a.isNew ? -1 : 1;
      return a.r - b.r;
    });

    return scored.slice(0, count).map(s => s.def);
  }

  function startClusterSession(clusterId) {
    const defs = pickPrioritizedDefs(12, clusterId, false);
    launchQuestionQueue(defs, 'fsrs_daily', `Clúster: ${CLUSTERS[clusterId].name}`);
  }

  function startSession(mode, count = 12) {
    const onlyConf = mode === 'confusions_only';
    const defs = pickPrioritizedDefs(count, null, onlyConf);
    const effectiveMode = onlyConf ? 'fsrs_daily' : mode;
    const titleMap = {
      fsrs_daily: 'Sesión Inteligente FSRS',
      twins: 'Duelo de Gemelos y Nombres Trampa',
      inverse: 'Inverso Letal (Término → Definición)',
      impostor: 'Caza al Impostor (Sabotaje)',
      cloze: 'Francotirador de Negritas'
    };
    launchQuestionQueue(defs, effectiveMode, onlyConf ? 'Asalto a tus Cruces de Confusión' : (titleMap[effectiveMode] || 'Entrenamiento'));
  }

  function launchQuestionQueue(defs, mode, sessionTitle) {
    const questions = defs.map(d => {
      if (mode === 'twins') return buildTwinsQuestion(d);
      if (mode === 'inverse') return buildInverseQuestion(d);
      if (mode === 'impostor') return buildImpostorQuestion(d);
      if (mode === 'cloze') return buildClozeQuestion(d);
      return buildSmartFSRSQuestion(d);
    });

    currentSession = {
      title: sessionTitle, mode, questions, index: 0,
      correctCount: 0, wrongCount: 0, requeueCount: 0,
      questionStartMs: Date.now(), usedHint: false, answered: false, lastAutoGrade: null
    };
    renderActiveQuestion();
  }

  function showQuestionHint() {
    if (!currentSession || currentSession.answered) return;
    currentSession.usedHint = true;
    const hb = document.getElementById('hint-box');
    if (hb) hb.classList.remove('hidden');

  function selectClozeBankPill(bankIdx) {
    if (!currentSession || currentSession.answered) return;
    const q = currentSession.questions[currentSession.index];
    const emptySlotIdx = q.filled.findIndex(v => v === null);
    if (emptySlotIdx === -1) return;
    q.filled[emptySlotIdx] = { bankIdx, text: q.bank[bankIdx] };
    const pill = document.getElementById(`cloze-pill-${bankIdx}`);
    if (pill) {
      pill.disabled = true;
      pill.classList.add('opacity-30', 'pointer-events-none');
    }
    refreshClozeSlotsUI();
  }

  function clearClozeSlot(slotIdx) {
    if (!currentSession || currentSession.answered) return;
    const q = currentSession.questions[currentSession.index];
    const item = q.filled[slotIdx];
    if (!item) return;
    const pill = document.getElementById(`cloze-pill-${item.bankIdx}`);
    if (pill) {
      pill.disabled = false;
      pill.classList.remove('opacity-30', 'pointer-events-none');
    }
    q.filled[slotIdx] = null;
    refreshClozeSlotsUI();
  }

  function refreshClozeSlotsUI() {
    const q = currentSession.questions[currentSession.index];
    const slots = document.querySelectorAll('#cloze-sentence .cloze-slot');
    slots.forEach((el, idx) => {
      const f = q.filled[idx];
      if (f) {
        el.textContent = f.text;
        el.classList.add('filled');
      } else {
        el.textContent = `[ Hueco ${idx + 1} ]`;
        el.classList.remove('filled');
      }
    });
  }

  function submitClozeAnswer() {
    if (!currentSession || currentSession.answered) return;
    const q = currentSession.questions[currentSession.index];
    let allCorrect = true;
    const slots = document.querySelectorAll('#cloze-sentence .cloze-slot');
    q.targets.forEach((targetPhrase, idx) => {
      const userEntry = q.filled[idx];
      const ok = userEntry && userEntry.text.toLowerCase() === targetPhrase.toLowerCase();
      if (!ok) {
        allCorrect = false;
        if (slots[idx]) {
          slots[idx].classList.remove('filled');
          slots[idx].classList.add('wrong');
          slots[idx].innerHTML = `${userEntry ? `<s class="opacity-70 mr-1">${userEntry.text}</s>` : ''} → <b>${targetPhrase}</b>`;
        }
      }
    });
    const btn = document.getElementById('btn-submit-cloze');
    if (btn) btn.classList.add('hidden');
    finalizeQuestionTurn(allCorrect, null, '');
  }

  function submitMultipleChoice(selectedIdx) {
    if (!currentSession || currentSession.answered) return;
    const q = currentSession.questions[currentSession.index];
    const chosen = q.options[selectedIdx];
    const isCorrect = Boolean(chosen.isCorrect);

    q.options.forEach((opt, idx) => {
      const btn = document.getElementById(`opt-btn-${idx}`);
      if (!btn) return;
      btn.disabled = true;
      if (opt.isCorrect) btn.classList.add('correct-ans');
      else if (idx === selectedIdx && !opt.isCorrect) btn.classList.add('wrong-ans');
      if (opt.tag) {
        const tagEl = document.createElement('div');
        tagEl.className = 'text-xs mt-1.5 font-semibold ' + (opt.isCorrect ? 'text-emerald-300' : 'text-amber-300/90');
        tagEl.textContent = '↳ ' + opt.tag;
        btn.querySelector('span.flex-1').appendChild(tagEl);
      }
    });

    const confusedDefId = !isCorrect && chosen.defId ? chosen.defId : null;
    finalizeQuestionTurn(isCorrect, confusedDefId, chosen.tag || '');
  }

  function finalizeQuestionTurn(isCorrect, confusedWithId, extraNote) {
    currentSession.answered = true;
    const q = currentSession.questions[currentSession.index];
    const elapsedSec = (Date.now() - currentSession.questionStartMs) / 1000;

    let autoGrade = 1;
    if (isCorrect) {
      if (currentSession.usedHint || elapsedSec > 18) autoGrade = 2;
      else if (elapsedSec < 5.5) autoGrade = 4;
      else autoGrade = 3;
      currentSession.correctCount++;
    } else {
      autoGrade = 1;
      currentSession.wrongCount++;
      if (confusedWithId) recordConfusion(q.def.id, confusedWithId);
      if (currentSession.requeueCount < 4) {
        currentSession.requeueCount++;
        currentSession.questions.push(buildTwinsQuestion(q.def, false));
      }
    }

    currentSession.prevCardSnapshot = JSON.parse(JSON.stringify(appState.cards[q.def.id] || createEmptyCard(q.def.id)));
    const fsrsRes = applyFSRSGrade(q.def.id, autoGrade);
    currentSession.lastAutoGrade = autoGrade;
    renderTurnFeedback(q, isCorrect, confusedWithId, elapsedSec, autoGrade, fsrsRes, extraNote);
  }

  function overrideTurnFSRS(newGrade) {
    if (!currentSession || !currentSession.answered) return;
    const q = currentSession.questions[currentSession.index];
    appState.cards[q.def.id] = JSON.parse(JSON.stringify(currentSession.prevCardSnapshot));
    const fsrsRes = applyFSRSGrade(q.def.id, newGrade);
    currentSession.lastAutoGrade = newGrade;
    renderTurnFeedback(q, newGrade >= 2, null, 0, newGrade, fsrsRes, 'Calificación FSRS ajustada manualmente.');
  }

  function renderTurnFeedback(q, isCorrect, confusedWithId, elapsedSec, activeGrade, fsrsRes, extraNote) {
    const fb = document.getElementById('feedback-box');
    if (!fb) return;
    fb.classList.remove('hidden');

    const gradeNames = { 1: 'AGAIN (1 · Olvido)', 2: 'HARD (2 · Dudoso)', 3: 'GOOD (3 · Bien)', 4: 'EASY (4 · Rápido)' };
    const gradeColors = {
      1: 'bg-rose-500/20 text-rose-300 border-rose-500/40',
      2: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      3: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      4: 'bg-sky-500/20 text-sky-300 border-sky-500/40'
    };

    const confusedDef = confusedWithId ? getDefById(confusedWithId) : null;
    const baseSnap = currentSession.prevCardSnapshot || createEmptyCard(q.def.id);

    fb.innerHTML = `
      <div class="p-4 rounded-xl border ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/40' : 'bg-rose-950/40 border-rose-500/40'} space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="text-lg">${isCorrect ? '✅' : '❌'}</span>
            <span class="font-black text-sm sm:text-base ${isCorrect ? 'text-emerald-300' : 'text-rose-300'}">
              ${isCorrect ? `¡Correcto! (${elapsedSec ? elapsedSec.toFixed(1) + 's' : 'Ajustado'})` : '¡Cuidado! Has caído en la trampa'}
            </span>
          </div>
          <span class="text-xs font-extrabold px-2.5 py-1 rounded-full border ${gradeColors[activeGrade]}">
            FSRS: ${gradeNames[activeGrade]} → Próximo repaso en ${formatInterval(fsrsRes.intervalDays)}
          </span>
        </div>

        <div class="p-3 rounded-lg bg-slate-900/90 border border-slate-700/80 text-xs sm:text-sm space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="font-black text-emerald-400">${q.def.num}. ${q.def.term}</span>
            <span class="text-[11px] text-amber-300 font-bold">🔑 Gatillo: ${q.def.hook}</span>
          </div>
          <p class="text-slate-200 leading-relaxed kw-highlight">${q.def.def}</p>
        </div>

        ${confusedDef ? `
          <div class="p-3 rounded-lg bg-rose-950/60 border border-rose-500/40 text-xs space-y-1">
            <div class="font-extrabold text-rose-300">⚠️ Lo has confundido con su gemelo «${confusedDef.num}. ${confusedDef.term}»:</div>
            <p class="text-slate-300 kw-highlight">${confusedDef.def}</p>
            <div class="text-amber-300 font-bold">↳ Diferencia clave: ${confusedDef.hook}</div>
          </div>
        ` : ''}

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-2">
          <div class="flex flex-wrap items-center gap-1.5">
            <span class="text-[11px] text-slate-400 mr-1">¿Cambiar nota FSRS?:</span>
            ${[1, 2, 3, 4].map(g => {
              const prev = previewFSRS(baseSnap, g);
              const labels = { 1: 'Again', 2: 'Hard', 3: 'Good', 4: 'Easy' };
              const activeCls = activeGrade === g ? 'ring-2 ring-white font-black' : 'opacity-75 hover:opacity-100';
              return `
                <button onclick="overrideTurnFSRS(${g})" class="px-2 py-1 rounded text-[11px] border ${gradeColors[g]} ${activeCls} transition">
                  ${labels[g]} (${formatInterval(prev.intervalDays)})
                </button>
              `;
            }).join('')}
          </div>

          <button onclick="nextSessionQuestion()" id="btn-next-q" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs sm:text-sm transition shadow-lg">
            Siguiente (${currentSession.index + 1}/${currentSession.questions.length}) →
          </button>
        </div>
      </div>
    `;
  }

  function nextSessionQuestion() {
    if (!currentSession) return;
    currentSession.index++;
    renderActiveQuestion();
  }

  function renderSessionSummary() {
    const container = document.getElementById('tab-play');
    if (!container || !currentSession) return;
    const total = currentSession.correctCount + currentSession.wrongCount;
    const pct = total > 0 ? Math.round((currentSession.correctCount / total) * 100) : 100;
    const dueRemaining = getDueDefinitions().length;

    container.innerHTML = `
      <div class="max-w-xl mx-auto rounded-2xl bg-[#131c31] border border-emerald-500/40 p-6 text-center space-y-5 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl mx-auto">🏁</div>
        <div>
          <span class="text-xs font-extrabold uppercase tracking-wider text-emerald-400">${currentSession.title}</span>
          <h2 class="text-2xl font-black text-white mt-1">¡Sesión Completada!</h2>
          <p class="text-xs text-slate-400 mt-1">${getNextDueForecastText()}</p>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-emerald-400">${pct}%</div>
            <div class="text-[11px] text-slate-400">Precisión</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-sky-400">${currentSession.correctCount}</div>
            <div class="text-[11px] text-slate-400">Aciertos</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-amber-400">${dueRemaining}</div>
            <div class="text-[11px] text-slate-400">Pendientes hoy</div>
          </div>
        </div>

        <div class="p-4 rounded-xl bg-slate-950 border border-amber-500/40 text-left text-xs space-y-1.5">
          <div class="font-extrabold text-amber-400 uppercase tracking-wider">🎯 QUÉ PULSAR AHORA EN TU TARJETA DE ANKI:</div>
          <div class="text-sm font-black text-white">${getAnkiSingleCardAdvice().headline}</div>
          <p class="text-slate-300 leading-relaxed">${getAnkiSingleCardAdvice().detail}</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2.5 justify-center">
          ${dueRemaining > 0 ? `
            <button onclick="startSession('fsrs_daily', 15)" class="px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm transition">
              ⚡ Continuar (${Math.min(15, dueRemaining)} restantes)
            </button>
          ` : ''}
          <button onclick="renderPlayHub()" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm transition">
            Volver al Panel Principal
          </button>
        </div>
      </div>
    `;
  }
  </script>
  <script>
  let speedState = null;

  function startSpeedMatch() {
    if (speedMatchTimer) clearInterval(speedMatchTimer);
    speedState = {
      secondsLeft: 90, score: 0, combo: 0, matchedTotal: 0, mistakes: 0,
      selectedLeft: null, selectedRight: null, boardPairs: [], matchedIds: new Set()
    };
    loadNextSpeedBoard();
    renderSpeedMatchUI();

    speedMatchTimer = setInterval(() => {
      if (!speedState) return;
      speedState.secondsLeft--;
      const timerEl = document.getElementById('speed-timer');
      if (timerEl) timerEl.textContent = `${speedState.secondsLeft}s`;
      if (speedState.secondsLeft <= 0) {
        clearInterval(speedMatchTimer);
        speedMatchTimer = null;
        renderSpeedMatchSummary();
      }
    }, 1000);
  }

  function loadNextSpeedBoard() {
    const clusters = Object.keys(CLUSTERS);
    let pool = getActiveDefinitions();
    if (Math.random() < 0.6) {
      const cId = clusters[Math.floor(Math.random() * clusters.length)];
      const cPool = pool.filter(d => d.cluster === cId);
      if (cPool.length >= 5) pool = cPool;
    }
    const chosen = shuffle(pool).slice(0, 5);
    speedState.boardPairs = chosen;
    speedState.leftOrder = shuffle(chosen.map(d => ({ id: d.id, label: `${d.num}. ${d.term}` })));
    speedState.rightOrder = shuffle(chosen.map(d => ({ id: d.id, label: d.hook })));
    speedState.matchedIds = new Set();
    speedState.selectedLeft = null;
    speedState.selectedRight = null;
  }

  function renderSpeedMatchUI() {
    const container = document.getElementById('tab-play');
    if (!container || !speedState) return;

    container.innerHTML = `
      <div class="max-w-4xl mx-auto space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 bg-[#131c31] border border-amber-500/40 rounded-2xl p-4">
          <div class="flex items-center gap-3">
            <button onclick="renderPlayHub()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">← Salir</button>
            <div>
              <h3 class="text-sm sm:text-base font-black text-white">⏱️ Ráfaga Contrarreloj · Conecta Concepto y Gatillo</h3>
              <p class="text-[11px] text-slate-400">Toca un concepto a la izquierda y su gatillo diferencial a la derecha</p>
            </div>
          </div>

          <div class="flex items-center gap-3 text-xs">
            <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700">
              Combo: <b id="speed-combo" class="text-amber-400">x${speedState.combo}</b>
            </div>
            <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700">
              Parejas: <b id="speed-pairs" class="text-emerald-400">${speedState.matchedTotal}</b>
            </div>
            <div class="px-3.5 py-1.5 rounded-xl bg-amber-500/20 border border-amber-500/40 font-mono font-black text-amber-300 text-sm" id="speed-timer">
              ${speedState.secondsLeft}s
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="speed-board">
          <div class="space-y-2.5">
            <div class="text-xs font-extrabold uppercase tracking-wider text-sky-400 px-1">Concepto de la Norma</div>
            ${speedState.leftOrder.map(item => `
              <div onclick="clickSpeedCard('left', '${item.id}')" id="speed-left-${item.id}" class="match-card p-3.5 rounded-xl bg-[#131c31] border border-slate-700 text-sm font-bold text-white flex items-center justify-between">
                <span>${item.label}</span>
                <span class="text-slate-500 text-xs">→</span>
              </div>
            `).join('')}
          </div>

          <div class="space-y-2.5">
            <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-400 px-1">Gatillo Diferencial ProCivil</div>
            ${speedState.rightOrder.map(item => `
              <div onclick="clickSpeedCard('right', '${item.id}')" id="speed-right-${item.id}" class="match-card p-3.5 rounded-xl bg-[#131c31] border border-slate-700 text-xs sm:text-sm text-slate-200 leading-snug">
                ${item.label}
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function clickSpeedCard(side, id) {
    if (!speedState || speedState.matchedIds.has(id)) return;
    if (side === 'left') speedState.selectedLeft = speedState.selectedLeft === id ? null : id;
    else speedState.selectedRight = speedState.selectedRight === id ? null : id;

    speedState.leftOrder.forEach(it => {
      const el = document.getElementById(`speed-left-${it.id}`);
      if (el) el.classList.toggle('selected', speedState.selectedLeft === it.id);
    });
    speedState.rightOrder.forEach(it => {
      const el = document.getElementById(`speed-right-${it.id}`);
      if (el) el.classList.toggle('selected', speedState.selectedRight === it.id);
    });

    if (speedState.selectedLeft && speedState.selectedRight) {
      const lId = speedState.selectedLeft;
      const rId = speedState.selectedRight;
      const lEl = document.getElementById(`speed-left-${lId}`);
      const rEl = document.getElementById(`speed-right-${rId}`);

      if (lId === rId) {
        speedState.matchedIds.add(lId);
        speedState.matchedTotal++;
        speedState.combo++;
        speedState.score += 100 * speedState.combo;
        applyFSRSGrade(lId, 3);

        if (lEl) { lEl.classList.remove('selected'); lEl.classList.add('matched'); }
        if (rEl) { rEl.classList.remove('selected'); rEl.classList.add('matched'); }
        speedState.selectedLeft = null;
        speedState.selectedRight = null;

        const cEl = document.getElementById('speed-combo');
        const pEl = document.getElementById('speed-pairs');
        if (cEl) cEl.textContent = `x${speedState.combo}`;
        if (pEl) pEl.textContent = speedState.matchedTotal;

        if (speedState.matchedIds.size >= speedState.boardPairs.length) {
          setTimeout(() => {
            if (speedState && speedState.secondsLeft > 0) {
              loadNextSpeedBoard();
              renderSpeedMatchUI();
            }
          }, 280);
        }
      } else {
        speedState.combo = 0;
        speedState.mistakes++;
        recordConfusion(lId, rId);
        applyFSRSGrade(lId, 1);

        if (lEl) lEl.classList.add('error-flash');
        if (rEl) rEl.classList.add('error-flash');
        speedState.selectedLeft = null;
        speedState.selectedRight = null;

        setTimeout(() => {
          if (lEl) lEl.classList.remove('selected', 'error-flash');
          if (rEl) rEl.classList.remove('selected', 'error-flash');
          const cEl = document.getElementById('speed-combo');
          if (cEl) cEl.textContent = 'x0';
        }, 420);
      }
    }
  }

  function renderSpeedMatchSummary() {
    const container = document.getElementById('tab-play');
    if (!container || !speedState) return;
    container.innerHTML = `
      <div class="max-w-lg mx-auto rounded-2xl bg-[#131c31] border border-amber-500/40 p-6 text-center space-y-5 shadow-2xl">
        <div class="text-4xl">⚡</div>
        <h2 class="text-2xl font-black text-white">¡Tiempo agotado!</h2>
        <div class="grid grid-cols-3 gap-3">
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-emerald-400">${speedState.matchedTotal}</div>
            <div class="text-[11px] text-slate-400">Parejas unidas</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-amber-400">${speedState.score}</div>
            <div class="text-[11px] text-slate-400">Puntos</div>
          </div>
          <div class="p-3 rounded-xl bg-slate-900 border border-slate-800">
            <div class="text-xl font-black text-rose-400">${speedState.mistakes}</div>
            <div class="text-[11px] text-slate-400">Cruces fallados</div>
          </div>
        </div>
        <p class="text-xs text-slate-300">Todas las parejas acertadas y falladas han actualizado su curva FSRS y tu registro de confusiones.</p>
        <div class="flex justify-center gap-3">
          <button onclick="startSpeedMatch()" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm">🔄 Repetir Ráfaga</button>
          <button onclick="renderPlayHub()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm">Volver al Panel</button>
        </div>
      </div>
    `;
  }

  let officialExamState = null;

  function startOfficialExamSession() {
    const realItems = OFFICIAL_QUESTIONS.map(oq => ({
      tag: `🏆 ${oq.exam}`, defId: oq.defId, stem: oq.stem,
      options: oq.options, correctIndex: oq.correctIndex, note: oq.note
    }));

    const usedIds = new Set(realItems.map(r => r.defId));
    const extraDefs = shuffle(getActiveDefinitions().filter(d => !usedIds.has(d.id))).slice(0, 8);
    const generatedItems = extraDefs.map(d => {
      const q = Math.random() < 0.65 ? buildTwinsQuestion(d, false) : buildInverseQuestion(d);
      const opts = q.options.map(o => o.text);
      const cIdx = q.options.findIndex(o => o.isCorrect);
      return {
        tag: `SIMULACRO GC · Def. ${d.num}`,
        defId: d.id,
        stem: q.mode === 'twins'
          ? `A los efectos de la Ley 42/2007, del Patrimonio Natural y de la Biodiversidad, cuando hablamos de «${stripHtml(d.def)}», nos referimos a:`
          : `A efectos de la Ley 42/2007, ¿qué se entenderá por «${d.term}»?`,
        options: opts,
        correctIndex: cIdx,
        note: `Gatillo clave de «${d.term}»: ${d.hook}`
      };
    });

    const allQuestions = [...realItems, ...generatedItems];
    officialExamState = {
      questions: allQuestions,
      userAnswers: new Array(allQuestions.length).fill(null),
      submitted: false
    };
    renderOfficialExamUI();
  }

  function renderOfficialExamUI() {
    const container = document.getElementById('tab-play');
    if (!container || !officialExamState) return;
    const { questions, userAnswers, submitted } = officialExamState;
    let hits = 0, errors = 0, blanks = 0;
    if (submitted) {
      questions.forEach((q, idx) => {
        const ans = userAnswers[idx];
        if (ans === null) blanks++;
        else if (ans === q.correctIndex) hits++;
        else errors++;
      });
    }
    const netPoints = Math.max(0, hits - errors / 3);
    const grade10 = ((netPoints / questions.length) * 10).toFixed(2);

    container.innerHTML = `
      <div class="max-w-4xl mx-auto space-y-5">
        <div class="flex flex-wrap items-center justify-between gap-3 bg-[#131c31] border border-indigo-500/40 rounded-2xl p-4">
          <div class="flex items-center gap-3">
            <button onclick="renderPlayHub()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">← Salir</button>
            <div>
              <h2 class="text-base sm:text-lg font-black text-white">🏆 Hoja de Examen Oficial GC · T16.2 Definiciones</h2>
              <p class="text-xs text-slate-400">Incluye las preguntas oficiales 2020-2025 + inéditas de corte oficial. Penalización: 3 fallos restan 1 acierto.</p>
            </div>
          </div>
          ${!submitted ? `
            <button onclick="submitOfficialExamSheet()" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs sm:text-sm shadow-lg">
              Corregir Hoja de Examen (${userAnswers.filter(x => x !== null).length}/${questions.length})
            </button>
          ` : `
            <div class="flex items-center gap-3">
              <div class="px-4 py-2 rounded-xl bg-slate-900 border border-emerald-500/40 text-right">
                <div class="text-xs text-slate-400">Nota Oficial Neta</div>
                <div class="text-xl font-black text-emerald-400">${grade10} / 10</div>
              </div>
              <button onclick="startOfficialExamSession()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                Nuevo Simulacro
              </button>
            </div>
          `}
        </div>

        ${submitted ? `
          <div class="grid grid-cols-3 gap-3 text-center">
            <div class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30">
              <div class="text-lg font-black text-emerald-400">${hits}</div>
              <div class="text-xs text-slate-300">Aciertos (+1)</div>
            </div>
            <div class="p-3 rounded-xl bg-rose-950/40 border border-rose-500/30">
              <div class="text-lg font-black text-rose-400">${errors}</div>
              <div class="text-xs text-slate-300">Errores (-0,33)</div>
            </div>
            <div class="p-3 rounded-xl bg-slate-900 border border-slate-700">
              <div class="text-lg font-black text-slate-300">${blanks}</div>
              <div class="text-xs text-slate-400">En blanco (0)</div>
            </div>
          </div>
        ` : ''}

  function exportProgressClipboard() {
    const str = JSON.stringify(appState);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(() => {
        const msg = document.getElementById('settings-msg');
        if (msg) msg.textContent = '✅ ¡Progreso FSRS copiado al portapapeles! Pégalo en tu móvil o PC.';
      });
    } else {
      prompt('Copia este código de progreso FSRS:', str);
    }

  function importProgressPrompt() {
    const raw = prompt('Pega aquí el código JSON de progreso FSRS exportado:');
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.cards) {
        appState = { ...appState, ...parsed };
        saveState();
        renderSettingsTab();
        const msg = document.getElementById('settings-msg');
        if (msg) msg.textContent = '✅ ¡Progreso importado correctamente!';
      }
    } catch (e) {
      alert('El código introducido no es un JSON válido.');
    }
  }

  });

  async function installPWA() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    const btn = document.getElementById('btn-install-pwa');
    if (btn) btn.classList.add('hidden');
  }

  function copyAnkiButtonHtml() {
    const snippet = '<a href="https://smetola.github.io/juego-T16.2/" style="display:inline-block;padding:14px 22px;background:#10b981;color:#0b1120;font-weight:900;border-radius:12px;text-decoration:none;">🎮 Abrir Laboratorio FSRS T16.2</a>';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(snippet).then(() => {
        const msg = document.getElementById('settings-msg');
        if (msg) msg.textContent = '✅ ¡Botón HTML para Anki copiado! Pégalo en tu tarjeta de Anki.';
      });
    } else {
      prompt('Copia este código HTML para tu tarjeta de Anki:', snippet);
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update();
      }).catch(() => {});
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadState();
    updateTopKPIs();
    renderPlayHub();
  });
  </script>
</body>
</html>
